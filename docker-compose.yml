services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: travel_php
    working_dir: /var/www/html
    volumes:
      - ./webApp:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: travel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./webApp:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: postgres:15
    container_name: travel_db
    environment:
      POSTGRES_DB: travel_paradise
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@travel.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
